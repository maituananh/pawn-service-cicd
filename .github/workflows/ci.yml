name: CI

on:
  push:
  pull_request:

jobs:
  validate-frontend-Jenkinsfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate Jenkinsfile
        run: |
          curl -X POST \
            https://jenkins.baotrang.io.vn/pipeline-model-converter/validate \
            -F "jenkinsfile=<jenkins/frontend/Jenkinsfile"

  validate-backend-Jenkinsfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate Jenkinsfile
        run: |
          curl -X POST \
            https://jenkins.baotrang.io.vn/pipeline-model-converter/validate \
            -F "jenkinsfile=<jenkins/backend/Jenkinsfile"
