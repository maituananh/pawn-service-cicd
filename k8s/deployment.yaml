apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment3
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deployment3
  template:
    metadata:
      labels:
        app: deployment3
    spec:
      containers:
        - name: simple-app3
          image: vietaws/eks:v1
          ports:
            - containerPort: 8080