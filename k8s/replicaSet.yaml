apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs3
  labels:
    app: rs-app3
    tier: free
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
        project: demo
    spec:
      containers:
        - name: simple-app3
          image: vietaws/eks:v1