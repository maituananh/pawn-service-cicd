global:
  scrape_interval: 20s
  scrape_timeout: 15s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node_exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: "mysqld"
    static_configs:
      - targets:
          - "mysql-exporter:9104"

  - job_name: backend
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "172.17.0.1:9999"