version: "3.9"

services:
  nginx-proxy:
    image: "nginx:latest"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./k8s-loadbalancer/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./k8s-loadbalancer/proxy-params.conf:/etc/nginx/snippets/proxy-params.conf
